<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle">Klangbild</title>
    <link rel="stylesheet" href="../popup/popup.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="options">
    <header>
      <div class="brand">
        <img src="../icons/icon.svg" alt="" width="24" height="24" />
        <span data-i18n="optionsTitle"></span>
      </div>
    </header>

    <section class="card">
      <h2 data-i18n="rememberedSites"></h2>
      <div id="sites" class="preset-list"></div>
      <div class="toggles"><button id="deleteSites" type="button" class="chip" data-i18n="deleteAll"></button></div>
    </section>

    <section class="card">
      <h2 data-i18n="disabledSites"></h2>
      <p class="hint" data-i18n="disabledSitesHint"></p>
      <div id="disabled" class="preset-list"></div>
    </section>

    <section class="card">
      <h2 data-i18n="rules"></h2>
      <p class="hint" data-i18n="rulesHint"></p>
      <div id="rules" class="preset-list"></div>
      <div class="preset-save rule-form">
        <input id="rulePattern" type="text" maxlength="300" spellcheck="false" />
        <select id="rulePreset"></select>
        <input id="ruleSpeed" type="number" min="0.1" max="16" step="0.05" />
        <button id="addRule" type="button" class="chip" data-i18n="addRule"></button>
      </div>
      <p id="ruleStatus" class="hint"></p>
    </section>

    <section class="card">
      <h2 data-i18n="sliderMode"></h2>
      <p class="hint" data-i18n="sliderModeHint"></p>
      <div class="mode-switch">
        <span data-i18n="sliderDrag"></span>
        <label class="switch">
          <input type="checkbox" id="knobToggle" />
          <span class="track"></span>
        </label>
        <span data-i18n="sliderTurn"></span>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="continueWatching"></h2>
      <p class="hint" data-i18n="continueWatchingHint"></p>
      <div class="toggles">
        <button id="resumeToggle" type="button" class="chip" data-i18n="continueWatchingOn"></button>
        <button id="resumeClear" type="button" class="chip"></button>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="customPresets"></h2>
      <div id="presets" class="preset-list"></div>
    </section>

    <section class="card">
      <h2 data-i18n="defaultSettings"></h2>
      <p id="defaultStatus" class="hint"></p>
      <div class="toggles"><button id="removeDefault" type="button" class="chip" data-i18n="removeDefault"></button></div>
    </section>

    <section class="card">
      <h2 data-i18n="backup"></h2>
      <p class="hint" data-i18n="backupHint"></p>
      <div class="toggles">
        <button id="export" type="button" class="chip" data-i18n="exportBackup"></button>
        <button id="import" type="button" class="chip" data-i18n="importBackup"></button>
        <input id="importFile" type="file" accept=".json,application/json" hidden />
      </div>
      <p id="backupStatus" class="hint"></p>
    </section>

    <script src="../common.js"></script>
    <script src="../popup/dom.js"></script>
    <script src="../popup/icons.js"></script>
    <script src="options.js"></script>
  </body>
</html>
