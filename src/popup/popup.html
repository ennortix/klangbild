<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Klangbild</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="../icons/icon.svg" alt="" width="20" height="20" />
        <span>Klangbild</span>
      </div>
      <label class="switch" data-i18n-title="toggleAllTitle">
        <input type="checkbox" id="enabled" />
        <span class="track"></span>
      </label>
    </header>

    <p id="status" class="status" data-i18n="connecting"></p>
    <button id="reloadResume" class="status-action" type="button" hidden data-i18n="reloadResume" data-i18n-title="reloadResumeHint"></button>

    <section id="timeline" class="timeline" hidden></section>
    <nav id="tabs" role="tablist"></nav>
    <main id="panels"></main>

    <footer>
      <label class="check">
        <input type="checkbox" id="siteSave" />
        <span id="rememberFor"></span>
      </label>
      <button id="resetAll" type="button"><span data-i18n="resetAll"></span></button>
    </footer>

    <script src="../common.js"></script>
    <script src="dom.js"></script>
    <script src="icons.js"></script>
    <script src="spectrum.js"></script>
    <script src="presets.js"></script>
    <script src="tools.js"></script>
    <script src="defaults.js"></script>
    <script src="sidebar.js"></script>
    <script src="sliderfx.js"></script>
    <script src="mixer.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
